<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>شقة غرفتين 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one full-height stage with the 3D model, a slim header of room sizes above it, floating view controls below.
   Palette: deep green-teal accent, cool paper neutrals, sky gradient that follows the theme. */
:root {
  --bg: #eef2ee;
  --fg: #1c2a24;
  --muted: #55665d;
  --panel: rgba(255, 255, 255, 0.86);
  --line: #cbd6ce;
  --accent: #1f6f5c;
  --accent-fg: #ffffff;
  --sky-top: #bcd9ea;
  --sky-bot: #e8f0ea;
  --ground: #b7d1a4;
  --lawn: #a6cc89;
  --font: 'Cairo', system-ui, 'Segoe UI', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111916; --fg: #e5eee8; --muted: #9bafa4; --panel: rgba(24, 34, 30, 0.88); --line: #2b3a34;
    --accent: #5cc2a4; --accent-fg: #0c1713; --sky-top: #15273a; --sky-bot: #26392f;
    --ground: #2b4030; --lawn: #34503a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111916; --fg: #e5eee8; --muted: #9bafa4; --panel: rgba(24, 34, 30, 0.88); --line: #2b3a34;
  --accent: #5cc2a4; --accent-fg: #0c1713; --sky-top: #15273a; --sky-bot: #26392f;
  --ground: #2b4030; --lawn: #34503a; color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; }
.app {
  height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; min-width: 0; }
h1 { margin: 0; font-size: 22px; font-weight: 700; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14px; }
.sizes { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; padding: 0; list-style: none; font-size: 14px; min-width: 0; }
.sizes li { color: var(--muted); }
.sizes b { color: var(--fg); font-weight: 600; }
.sizes bdi { font-variant-numeric: tabular-nums; }
.stage {
  position: relative; flex: 1; min-height: 300px; overflow: hidden; border-radius: 12px;
  background: linear-gradient(var(--sky-top), var(--sky-bot)); border: 1px solid var(--line);
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hint {
  position: absolute; top: 10px; inset-inline-start: 12px; max-width: calc(100% - 24px);
  font-size: 13px; color: var(--muted); background: var(--panel); padding: 4px 10px; border-radius: 8px;
}
.controls {
  position: absolute; bottom: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap;
  justify-content: center; gap: 8px;
}
button {
  font: inherit; font-size: 14px; font-weight: 600; color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; min-height: 40px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
</style>

<div class="app" dir="rtl" lang="ar">
  <header>
    <h1>شقة غرفتين</h1>
    <span class="sub">نموذج ثلاثي الأبعاد · المقاسات بالمتر</span>
    <ul class="sizes">
      <li><b>ريسبشن</b> <bdi dir="ltr">5.2 × 6.5</bdi></li>
      <li><b>غرفة 1</b> <bdi dir="ltr">3.5 × 4.25</bdi></li>
      <li><b>غرفة 2</b> <bdi dir="ltr">3.30 × 3.5</bdi></li>
      <li><b>حمام</b> <bdi dir="ltr">1.8 × 2.2</bdi></li>
      <li><b>مطبخ أمريكي</b></li>
    </ul>
  </header>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="hint">اسحب للتدوير · عجلة الماوس أو إصبعين للتكبير</div>
    <div class="controls">
      <button type="button" id="b-iso">منظر عام</button>
      <button type="button" id="b-top">منظر علوي</button>
      <button type="button" id="b-front">الواجهة</button>
      <button type="button" id="b-roof" aria-pressed="false">السقف</button>
      <button type="button" id="b-labels" aria-pressed="true">الأسماء</button>
      <button type="button" id="b-spin" aria-pressed="false">دوران تلقائي</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('c');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  } catch (e) {
    var f = document.createElement('div');
    f.className = 'fail';
    f.textContent = 'المتصفح لا يدعم العرض ثلاثي الأبعاد هنا. جرّب متصفحًا آخر.';
    stage.appendChild(f);
    return;
  }
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xe8f0ea, 45, 120);
  var camera = new THREE.PerspectiveCamera(38, 1, 0.1, 250);
  camera.position.set(14, 11.5, 15.5);
  var controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(6, 0, 3.2);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI / 2 - 0.03;
  controls.minDistance = 4;
  controls.maxDistance = 42;
  controls.autoRotateSpeed = 0.9;
  controls.update();

  /* lights */
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9a80, 0.85));
  var sun = new THREE.DirectionalLight(0xfff4e0, 0.85);
  sun.position.set(-6, 17, 15);
  sun.target.position.set(6, 0, 3);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -18; sun.shadow.camera.right = 18;
  sun.shadow.camera.top = 18; sun.shadow.camera.bottom = -18;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 60;
  sun.shadow.bias = -0.0005;
  scene.add(sun); scene.add(sun.target);

  /* helpers */
  var mats = {};
  function M(hex, o) {
    var k = hex + (o ? JSON.stringify(o) : '');
    if (!mats[k]) mats[k] = new THREE.MeshStandardMaterial(Object.assign({ color: hex, roughness: 0.85, metalness: 0 }, o || {}));
    return mats[k];
  }
  var root = new THREE.Group(); scene.add(root);
  var labelsGroup = new THREE.Group(); scene.add(labelsGroup);

  function block(x, z, w, d, h, hex, y0, o) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(hex, o));
    m.position.set(x + w / 2, (y0 || 0) + h / 2, z + d / 2);
    m.castShadow = true; m.receiveShadow = true;
    root.add(m); return m;
  }
  /* box placed along an axis: s = position along the wall, c = wall line, ls = length, tc = thickness */
  function abox(axis, s, y, c, ls, hy, tc, mat, shadow) {
    var sx = axis === 'x' ? ls : tc, sz = axis === 'x' ? tc : ls;
    var m = new THREE.Mesh(new THREE.BoxGeometry(sx, hy, sz), mat);
    m.position.set(axis === 'x' ? s : c, y, axis === 'x' ? c : s);
    if (shadow !== false) { m.castShadow = true; m.receiveShadow = true; }
    root.add(m); return m;
  }

  var glassMat = new THREE.MeshStandardMaterial({ color: 0xa9d3ee, transparent: true, opacity: 0.3, roughness: 0.1, metalness: 0.1, depthWrite: false });
  function windowPane(axis, c, a, b) {
    var len = b - a, mid = (a + b) / 2, y0 = 0.9, y1 = 2.1, h = y1 - y0, ft = 0.05, fm = M('#e9e5db');
    abox(axis, mid, (y0 + y1) / 2, c, len, h, 0.025, glassMat, false);
    abox(axis, mid, y1 - ft / 2, c, len, ft, 0.07, fm);
    abox(axis, mid, y0 + ft / 2, c, len, ft, 0.07, fm);
    abox(axis, a + ft / 2, (y0 + y1) / 2, c, ft, h, 0.07, fm);
    abox(axis, b - ft / 2, (y0 + y1) / 2, c, ft, h, 0.07, fm);
    abox(axis, mid, (y0 + y1) / 2, c, ft * 0.8, h, 0.07, fm);
  }

  var H = 2.8;
  function wall(axis, c, s0, s1, t, ops) {
    var wm = M('#f4f1ea');
    ops = ops.slice().sort(function (p, q) { return p.a - q.a; });
    function seg(a, b, y0, y1) {
      if (b - a < 0.001 || y1 - y0 < 0.001) return;
      abox(axis, (a + b) / 2, (y0 + y1) / 2, c, b - a, y1 - y0, t, wm);
    }
    var cur = s0;
    ops.forEach(function (o) {
      seg(cur, o.a, 0, H);
      if (o.k === 'win') { seg(o.a, o.b, 0, 0.9); seg(o.a, o.b, 2.1, H); windowPane(axis, c, o.a, o.b); }
      else { seg(o.a, o.b, 2.1, H); }
      cur = o.b;
    });
    seg(cur, s1, 0, H);
  }
  function W(a, b) { return { a: a, b: b, k: 'win' }; }
  function D(a, b) { return { a: a, b: b, k: 'door' }; }

  function door(hx, hz, len, deg, hex) {
    var g = new THREE.Group();
    g.position.set(hx, 0, hz);
    g.rotation.y = THREE.MathUtils.degToRad(deg);
    var m = new THREE.Mesh(new THREE.BoxGeometry(len, 2.05, 0.045), M(hex || '#9a7650'));
    m.position.set(len / 2, 1.025, 0);
    m.castShadow = true;
    g.add(m);
    var knob = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), M('#c9b27a', { metalness: 0.6, roughness: 0.4 }));
    knob.position.set(len - 0.08, 1.0, 0.045);
    g.add(knob);
    root.add(g);
  }

  /* site. West = front garden 2 x 7.5, east = back garden 1 x 7.5, north = side garden 13.5 x 1.75 */
  var groundMat = new THREE.MeshStandardMaterial({ color: 0xb7d1a4, roughness: 1 });
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), groundMat);
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.03; ground.receiveShadow = true; scene.add(ground);
  var lawnMat = new THREE.MeshStandardMaterial({ color: 0xa6cc89, roughness: 1 });
  function lawnRect(x0, z0, x1, z1) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, 0.03, z1 - z0), lawnMat);
    m.position.set((x0 + x1) / 2, -0.015, (z0 + z1) / 2); m.receiveShadow = true; scene.add(m);
  }
  lawnRect(-2, 0, 0, 7.5);
  lawnRect(12, 0, 13, 7.5);
  lawnRect(-0.5, -1.75, 13, 0);
  var pave = new THREE.Mesh(new THREE.BoxGeometry(15.5, 0.02, 1.6), M('#c9c5ba'));
  pave.position.set(5.5, -0.01, 8.3); pave.receiveShadow = true; scene.add(pave);

  var fenceMat = M('#e7e2d6');
  function lowWall(axis, c, s0, s1) { abox(axis, (s0 + s1) / 2, 0.35, c, s1 - s0, 0.7, 0.1, fenceMat); }
  lowWall('z', -2, 0, 6.6); lowWall('z', -2, 7.4, 7.5);      /* gate in front of the building door */
  lowWall('x', 7.5, -2, 0);
  lowWall('x', 0, -2, -0.5); lowWall('z', -0.5, -1.75, 0);
  lowWall('x', -1.75, -0.5, 13);
  lowWall('z', 13, -1.75, 7.5);
  lowWall('x', 7.5, 12, 13);
  block(-2, 6.6, 2.0, 0.8, 0.02, '#cfc8b8', 0);               /* path to the building door */

  function tree(x, z, s) {
    var g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s);
    var tr = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 1.2, 8), M('#7a5a3e'));
    tr.position.y = 0.6; tr.castShadow = true; g.add(tr);
    var fo = new THREE.Mesh(new THREE.IcosahedronGeometry(0.85, 1), M('#5f9a55', { flatShading: true }));
    fo.position.y = 1.7; fo.castShadow = true; g.add(fo);
    var fo2 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.55, 1), M('#6aa95e', { flatShading: true }));
    fo2.position.set(0.35, 2.2, 0.1); fo2.castShadow = true; g.add(fo2);
    scene.add(g);
  }
  tree(-1.2, 0.9, 0.6); tree(-1.2, 5.2, 0.6);
  tree(12.5, 3.3, 0.35); tree(12.5, 5.0, 0.35);
  tree(0.4, -1.0, 0.6); tree(4.9, -1.0, 0.5); tree(8.5, -1.0, 0.6); tree(12.2, -1.0, 0.5);

  /* floors */
  block(0, 0, 5.2, 6.5, 0.02, '#e6dfd0', 0);       /* reception */
  block(5.2, 4.25, 4.6, 1.05, 0.02, '#e6dfd0', 0);  /* hall */
  block(8.7, 3.5, 1.1, 0.75, 0.02, '#e6dfd0', 0);
  block(5.2, 0, 3.5, 4.25, 0.02, '#c8a57a', 0);     /* room 1 */
  block(8.7, 0, 3.3, 3.5, 0.02, '#c8a57a', 0);      /* room 2: two 120 cm beds, 160 cm wardrobe, 120 cm desk */
  block(9.45, 0.15, 1.2, 2.0, 0.45, '#e6e1d6');           /* bed A */
  block(9.45, 0.07, 1.2, 0.08, 0.95, '#7a5a3e');
  block(9.75, 0.25, 0.6, 0.35, 0.12, '#ffffff', 0.45);
  block(9.45, 1.0, 1.2, 1.15, 0.06, '#7fa3b8', 0.45);
  block(10.74, 0.15, 1.2, 2.0, 0.45, '#e0e6e1');          /* bed B */
  block(10.74, 0.07, 1.2, 0.08, 0.95, '#7a5a3e');
  block(11.04, 0.25, 0.6, 0.35, 0.12, '#ffffff', 0.45);
  block(10.74, 1.0, 1.2, 1.15, 0.06, '#b8a07f', 0.45);
  block(8.76, 0.1, 0.6, 1.6, 2.1, '#a88562');             /* wardrobe 160 cm on the west wall */
  block(9.355, 0.9, 0.015, 0.01, 2.0, '#7b5b42', 0.05);
  block(9.36, 0.75, 0.02, 0.04, 0.2, '#c9b27a', 1.0);
  block(9.36, 1.0, 0.02, 0.04, 0.2, '#c9b27a', 1.0);
  block(9.9, 2.9, 1.2, 0.55, 0.04, '#b89874', 0.74);      /* desk 120 cm on the south wall */
  block(9.92, 2.92, 0.05, 0.05, 0.74, '#8a6a4b');
  block(11.03, 2.92, 0.05, 0.05, 0.74, '#8a6a4b');
  block(9.92, 3.38, 0.05, 0.05, 0.74, '#8a6a4b');
  block(11.03, 3.38, 0.05, 0.05, 0.74, '#8a6a4b');
  block(10.3, 3.05, 0.35, 0.25, 0.015, '#555555', 0.78);
  block(10.3, 3.28, 0.35, 0.012, 0.22, '#222222', 0.78);
  block(10.85, 3.1, 0.1, 0.1, 0.3, '#f3e6c0', 0.78, { emissive: 0xffe9a8, emissiveIntensity: 0.5 });
  block(10.3, 2.45, 0.42, 0.42, 0.45, '#4d6a7a');         /* desk chair */
  block(10.3, 2.41, 0.42, 0.06, 0.9, '#43606f');

  /* kitchen */
  block(9.8, 3.5, 2.2, 1.8, 0.02, '#c9dbe5', 0);    /* bathroom */

  /* walls: exterior 12.5 cm, interior 7.5 cm */
  var tE = 0.125, tI = 0.075;
  wall('x', 0, -tE / 2, 12 + tE / 2, tE, [W(1.2, 3.8), W(6.2, 7.7), W(9.4, 11.4)]);
  wall('x', 6.5, -tE / 2, 12 + tE / 2, tE, [D(1.5, 2.4)]);
  wall('z', 0, tE / 2, 6.5 - tE / 2, tE, [W(2.2, 4.4)]);
  wall('z', 12, tE / 2, 6.5 - tE / 2, tE, [W(1.0, 2.4), W(3.9, 4.7), W(5.6, 6.2)]);
  wall('z', 5.2, tE / 2, 6.5 - tE / 2, tI, [D(4.45, 5.25)]);
  wall('z', 8.7, tE / 2, 4.25, tI, []);
  wall('x', 4.25, 5.2, 8.7, tI, [D(5.5, 6.4)]);
  wall('x', 3.5, 8.7, 12 - tE / 2, tI, [D(9.0, 9.7)]);
  wall('z', 9.8, 3.5, 5.3, tI, [D(4.2, 4.9)]);
  wall('x', 5.3, 9.8, 12 - tE / 2, tI, []);

  door(1.5, 6.5, 0.9, 70, '#6b4f37');
  door(5.5, 4.25, 0.9, 70);
  door(9.0, 3.5, 0.7, 70);
  door(9.8, 4.2, 0.7, -20);

  /* building entrance and stair to the two floors above: a 1 m strip along the south side with a glazed front */
  var wmat = M('#f4f1ea'), frameM = M('#e9e5db'), SH = 5.6;
  block(0, 6.5, 3.0, 1.0, 0.02, '#d8d2c4', 0);                /* entrance lobby floor */
  for (var si = 0; si < 32; si++) block(3.0 + si * 0.28, 6.5625, 0.28, 0.875, (si + 1) * 0.175, '#d9d4c7');
  abox('x', 6, 0.45, 7.5, 12.125, 0.9, tE, wmat);             /* south: solid base */
  abox('x', 6, 3.25, 7.5, 12, 4.7, 0.03, glassMat, false);    /* south: glass */
  [0, 3, 6, 9, 12].forEach(function (mx) { abox('x', mx, 3.25, 7.5, 0.07, 4.7, 0.09, frameM); });
  [2.8, 5.6].forEach(function (my) { abox('x', 6, my, 7.5, 12, 0.08, 0.1, frameM); });
  abox('z', 7.0, SH / 2, 12, 1.125, SH, tE, wmat);            /* east end */
  abox('z', 6.51875, SH / 2, 0, 0.1625, SH, tE, wmat);        /* west wall with the building door */
  abox('z', 7.48125, SH / 2, 0, 0.1625, SH, tE, wmat);
  abox('z', 7.0, (2.1 + SH) / 2, 0, 0.8, SH - 2.1, tE, wmat);
  abox('x', 7.5, (2.8 + SH) / 2, 6.5, 9, SH - 2.8, tE, wmat); /* stair wall above the apartment roof line */
  door(0, 6.6, 0.8, -20, '#6b4f37');
  var stairRoof = new THREE.Mesh(new THREE.BoxGeometry(12.3, 0.18, 1.3), M('#d4cec2'));
  stairRoof.position.set(6, SH + 0.09, 7.0); stairRoof.castShadow = true; stairRoof.visible = false;
  scene.add(stairRoof);

  /* roof (hidden by default so the inside is visible) */
  var roof = new THREE.Mesh(new THREE.BoxGeometry(12.6, 0.18, 6.85), M('#d4cec2'));
  roof.position.set(6, H + 0.09, 3.25); roof.castShadow = true; roof.receiveShadow = true; roof.visible = false;
  scene.add(roof);

  /* furniture: reception. Facing in from the entrance: front = north, left = west wall, right = east wall */
  var sofaSeat = '#4d6a7a', sofaBack = '#43606f', cush = '#d9c7a3';
  block(0.12, 0.12, 2.7, 0.95, 0.45, sofaSeat);          /* L sofa: long arm on the north wall */
  block(0.12, 1.07, 0.95, 2.1, 0.45, sofaSeat);          /* L sofa: short arm on the west wall */
  block(0.12, 0.12, 2.7, 0.25, 0.92, sofaBack);
  block(0.12, 1.07, 0.25, 2.1, 0.92, sofaBack);
  block(2.57, 0.37, 0.25, 0.7, 0.65, sofaBack);          /* arm rests */
  block(0.37, 2.97, 0.7, 0.2, 0.65, sofaBack);
  block(0.55, 0.4, 0.55, 0.16, 0.38, cush, 0.45);
  block(1.55, 0.4, 0.55, 0.16, 0.38, cush, 0.45);
  block(0.4, 1.8, 0.16, 0.55, 0.38, cush, 0.45);
  block(1.0, 1.2, 2.6, 2.3, 0.012, '#b9c7c0', 0.02);     /* rug */
  block(1.75, 1.85, 1.0, 0.65, 0.04, '#8a6a4b', 0.36);   /* coffee table */

    cx.fillStyle = tint || 'rgba(255,255,255,0.9)';
    var r = 26, w = cv.width, h = cv.height;
    cx.beginPath(); cx.moveTo(r, 0); cx.arcTo(w, 0, w, h, r); cx.arcTo(w, h, 0, h, r); cx.arcTo(0, h, 0, 0, r); cx.arcTo(0, 0, w, 0, r); cx.closePath(); cx.fill();
    cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillStyle = '#1c2a24';

  /* theme: fog, ground and lawn follow the page tokens */

  }

  /* camera moves */
  var fly = null;
  function flyTo(p, t) {
    var d = reduceMotion ? 1 : 900;
    fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: new THREE.Vector3(p[0], p[1], p[2]), t1: new THREE.Vector3(t[0], t[1], t[2]), s: performance.now(), d: d };
  }
  controls.addEventListener('start', function () { fly = null; });
  function wide() { return camera.aspect < 0.9; }
  document.getElementById('b-iso').addEventListener('click', function () { var k = wide() ? 1.5 : 1; flyTo([6 + 8 * k, 11.5 * k, 3.2 + 12.3 * k], [6, 0, 3.2]); });
  document.getElementById('b-top').addEventListener('click', function () { flyTo([6, wide() ? 30 : 21, 4.0], [6, 0, 3.2]); });

  function toggle(id, fn) {
    var b = document.getElementById(id);
    b.addEventListener('click', function () {
      var on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', on ? 'true' : 'false');

    });

  /* size + loop */
  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = camera.aspect < 0.9 ? 58 : 38;
    camera.updateProjectionMatrix();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize', resize);
  resize();

  function loop(now) {
    if (fly) {
      var k = Math.min(1, (now - fly.s) / fly.d);
      var e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      camera.position.lerpVectors(fly.p0, fly.p1, e);
      controls.target.lerpVectors(fly.t0, fly.t1, e);
      if (k >= 1) fly = null;
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
